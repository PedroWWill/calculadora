<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Calculadora Interativa</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
       <h1 class="t1">Calculadora</h1>
       <h2 class="t2">Veja se você sabe como funciona uma calculadora de verdade!</h2>
   </header>

   <main>
       <section class="calculadora">
           <!-- Adicionado atributos de acessibilidade (Aria) para leitores de tela -->
           <div class="tela" id="tela" role="status" aria-live="polite"></div>
           
           <div class="botao">
               <button type="button" class="operador">C</button>
               <button type="button" class="operador">/</button>
               <button type="button" class="operador">+</button>
               <button type="button" class="operador">*</button>
               <button type="button">7</button>
               <button type="button">8</button>
               <button type="button">9</button>
               <button type="button" class="operador">-</button>
               <button type="button">4</button>
               <button type="button">5</button>
               <button type="button">6</button>
               <button type="button" class="operador">=</button>
               <button type="button">1</button>
               <button type="button">2</button>
               <button type="button">3</button>
               <button type="button">0</button>
           </div>
       </section>
   </main>

   <!-- Rodapé semântico adicionado para seguir os requisitos -->
   <footer>
       <p>Projeto de Calculadora - 2024</p>
   </footer>

   <script src="script.js" defer></script>
</body>
</html>
